[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airmentor-pipeline"
version = "2.0.0"
description = "Deterministic, parallel-safe, hallucination-guarded automation layer for AirMentor audit OS"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Proprietary"}
dependencies = [
  "textual>=0.80,<2",
  "rich>=13,<14",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-xdist>=3,<4",
]

[project.scripts]
airmentor-pipeline = "pipeline.orchestrator.main:main"
airmentor-pipeline-tui = "pipeline.tui.dashboard:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"

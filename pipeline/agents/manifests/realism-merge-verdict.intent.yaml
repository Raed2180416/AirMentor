purpose: |
  Merge all independent realism audits into one defensible verdict. Preserve dissent, elevate browser blockers, and produce a prioritized fix and re-verification queue.
nonneg:
  - Keep intent and feature intent at the front of every judgment
  - Do not modify product code; write audit artifacts only
  - Browser blockers override API-only green claims
  - Future evidence leaks and fake probability or causal claims are critical unless disproven
  - Separate demo blockers, must-fix before demo, caveat-acceptable items, and production debt

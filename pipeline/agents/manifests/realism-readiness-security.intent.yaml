purpose: |
  Real-data readiness, privacy/security, audit, model-governance, and operational maturity audit. Show what is demo-safe, what is deployment debt, and what must exist before real institutional use.
nonneg:
  - Keep intent and feature intent at the front of every judgment
  - Do not modify product code; write audit artifacts only
  - Treat CERT-In incident logging/reporting and audit trails as India deployment readiness gates
  - Do not claim production readiness when only a maturity document exists
  - Cover data contract, import validation, privacy/security, model governance, real-data validation, and operations

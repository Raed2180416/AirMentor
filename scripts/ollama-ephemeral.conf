# Ollama Ephemeral Configuration for AirMentor Agentic OS
# Place this in /etc/systemd/user/ollama.service.d/ or set env vars
# NEVER keep models loaded. Load-on-demand, unload-immediately.

[Service]
Environment="OLLAMA_KEEP_ALIVE=0"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_FLASH_ATTENTION=1"

# AirMentor Ollama Quality Configuration
# Applies SOTA 2026 optimizations for maximum quality on local models
# Place in: /etc/systemd/system/ollama.service.d/airmentor-quality.conf
# Then: sudo systemctl daemon-reload && sudo systemctl restart ollama

[Service]
# NEVER keep models loaded — ephemeral only
Environment="OLLAMA_KEEP_ALIVE=0"

# Only one model at a time (prevents VRAM stacking)
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# Single request at a time (reduces peak memory)
Environment="OLLAMA_NUM_PARALLEL=1"

# Flash Attention — faster inference, less VRAM
Environment="OLLAMA_FLASH_ATTENTION=1"

# Speculative Decoding — 2-2.5x speedup for code generation
# Uses tiny draft model to predict tokens, main model verifies
Environment="OLLAMA_SPECULATIVE_DECODE=1"

# KV Cache quantization — compresses memory by 50% with minimal quality loss
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

# Context size for coding tasks (8K is enough for most files)
Environment="OLLAMA_NUM_CTX=8192"
